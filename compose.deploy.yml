# How abstimmungsstudio runs on the organisation's app platform (abst.d-o.li).
#
# The platform lays its own settings over this file at every deploy: for the
# service "app" the env file, the proxy network and the memory and CPU limits.
# They are decided in the infra repository, apps/abstimmungsstudio.yml and
# secrets/daily/abstimmungsstudio.prod.yaml; a setting is changed there, not
# here. The env file lies next to this file on the server, so the worker and
# the scheduler read it with "env_file: .env". It holds DATABASE_URL for the
# shared PostgreSQL server.
#
# Migrations are run by the platform at every deploy, before the app is
# switched to the new image ("release" in the app file).
#
# This file must not publish a port, and the web service must be called "app":
# Caddy on the app host sends requests for abst.d-o.li to its port 8000.
# .devcontainer/ is for development.
services:
  app:
    image: ghcr.io/digital-organizing/abstimmungsstudio:main
    command: gunicorn -w 4 core.wsgi:application --bind 0.0.0.0:8000
    depends_on: [redis]

  celery:
    image: ghcr.io/digital-organizing/abstimmungsstudio:main
    command: celery -A core worker --concurrency 2
    env_file: .env
    depends_on: [redis]
    restart: unless-stopped

  celery-beat:
    image: ghcr.io/digital-organizing/abstimmungsstudio:main
    command: celery -A core beat
    env_file: .env
    depends_on: [redis]
    restart: unless-stopped

  # Cache and Celery broker. Nothing in it has to survive a restart.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
