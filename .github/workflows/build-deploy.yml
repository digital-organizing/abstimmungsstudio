name: Docker

# Builds the image, publishes it to ghcr.io/digital-organizing/abstimmungsstudio
# and, on main, deploys it to the organisation's app platform.
on:
  push:
    branches: ["main"]
    # Publish semver tags as releases.
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Hands compose.deploy.yml to the organisation's app platform: the job joins
  # the tailnet and logs in to the app host through Tailscale SSH, so this
  # repository holds no SSH key. The platform runs the migrations before it
  # switches to the new image.
  #
  # These are the steps of the shared workflow
  # digital-organizing/infra/.github/workflows/deploy.yml, copied here: that
  # repository is private and this one is public, and a public repository
  # cannot call a workflow of a private one. Keep the two the same.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-abstimmungsstudio-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Join the tailnet as a CI node
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-daily

      - name: Deploy
        env:
          APP: abstimmungsstudio-prod
          HOST: app-daily
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          address=$(tailscale ip -4 "$HOST")
          run() { ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "deploy@$address" "$@"; }
          printf '%s' "$REGISTRY_TOKEN" | run "registry-login ghcr.io $REGISTRY_USER"
          run "deploy $APP" < compose.deploy.yml
